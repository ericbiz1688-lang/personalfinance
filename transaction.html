<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add transaction — Pocket</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="responsive.css" />
    <script src="transaction.js" defer></script>
  </head>
  <body class="entry-page">
    <header class="entry-topbar">
      <a class="brand" href="/">pocket<span class="brand-dot">.</span></a
      ><a class="back-link" href="/">← Back to overview</a>
    </header>
    <main class="entry-main">
      <p class="entry-intro">One entry. A clearer picture of your money.</p>
      <section
        class="transaction-editor"
        id="transaction-editor"
        aria-labelledby="editor-title"
      >
        <form id="transaction-form">
          <div class="dialog-header">
            <div>
              <p class="eyebrow">KEEP YOUR PICTURE UP TO DATE</p>
              <h2 id="editor-title">Add transaction</h2>
            </div>
          </div>
          <input type="hidden" id="transaction-id" />
          <fieldset class="type-options">
            <legend>Transaction type</legend>
            <label
              ><input type="radio" name="type" value="expense" checked />
              Expense</label
            ><label
              ><input type="radio" name="type" value="income" /> Income</label
            >
          </fieldset>
          <label
            >Description<input
              name="description"
              maxlength="100"
              required
              placeholder="e.g. Weekly groceries"
          /></label>
          <div class="form-row">
            <label
              >Amount (SGD)<input
                name="amount"
                type="number"
                min="0.01"
                max="100000000"
                step="0.01"
                required
                placeholder="0.00" /></label
            ><label>Date<input name="date" type="date" required /></label>
          </div>
          <label
            >Category<select
              name="category"
              id="form-category"
              required
            ></select
          ></label>
          <p id="form-error" class="form-error" role="alert"></p>
          <div class="dialog-footer">
            <button type="button" class="secondary" id="cancel-form">
              Cancel</button
            ><button class="primary" id="save-button" type="submit">
              Save transaction
            </button>
          </div>
        </form>
      </section>
      <p class="entry-note">
        Your transaction is saved only when you select Save.
      </p>
    </main>
  </body>
</html>
